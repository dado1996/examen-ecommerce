server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: checkout-backend
  mvc:
    problemdetails:
      enabled: true # Errores en formato RFC 9457, sin trazas internas
  jackson:
    # Request cerrado (additionalProperties: false en el contrato): un precio enviado por el
    # cliente se rechaza en lugar de ignorarse. Tampoco se aceptan "2" ni 1.5 como cantidad.
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false
  datasource:
    # foreign_keys=true: SQLite solo aplica las FK si se activan en cada conexión
    url: jdbc:sqlite:${APP_DB_PATH:./data/checkout.db}?foreign_keys=true
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite admite un solo escritor a la vez; una conexión evita SQLITE_BUSY
      maximum-pool-size: 1
  sql:
    init:
      # SQLite no se detecta como base embebida: sin "always" no se ejecutarían los scripts.
      # Ambos son idempotentes; se copian desde packages/schema al compilar (ver pom.xml).
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/seed.sql
      encoding: UTF-8

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
  # Límites contra abuso (ver docs/arquitectura.md, sección 9). Responden 413 PAYLOAD_TOO_LARGE y 429 TOO_MANY_REQUESTS.
  limits:
    # Cuerpo máximo en /api/**. Un pedido de 100 líneas (el máximo de items) ocupa unos 4 KB;
    # 16 KB deja margen para espacios y el cupón sin aceptar cuerpos que solo sirven para cargar el servidor.
    max-body-size: 16KB
    # POST /checkouts y /checkouts/preview por IP, en una sola cuenta: 60 por minuto, ráfagas incluidas.
    # Una persona que cambia cantidades y cupones no se acerca; un script sí.
    checkout-rate:
      requests: 60
      window: 1m
    # Cupones rechazados (INVALID_COUPON o COUPON_EXPIRED) por IP antes de bloquearla en esos endpoints.
    # 10 cada 15 minutos admite errores de tipeo y deja probar muy pocos códigos por hora.
    coupon-failures:
      requests: 10
      window: 15m

# Reglas de descuento parametrizables (ver docs/arquitectura.md, sección de supuestos).
# Los decimales van entre comillas: sin ellas YAML los lee como double antes de convertirlos a BigDecimal.
discounts:
  category:
    name: Tecnología
    rate: "0.10"
  volume:
    threshold: "100.00"
    rate: "0.05"
  coupon:
    code: WELCOME2026
    rate: "0.15"
    # Instante desde el cual el cupón deja de ser válido (exclusivo): vale todo 2026 en UTC.
    expires-at: "2027-01-01T00:00:00Z"
  max-total-rate: "0.35"

# GET /health: estado del servicio para monitoreo. UP (200) o DOWN (503) según la base y el disco.
# Sin detalles en la respuesta, para no exponer rutas ni versiones.
management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
