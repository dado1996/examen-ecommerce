openapi: 3.0.3
info:
  title: Core E-Commerce Checkout API
  version: 0.2.0
  description: >
    Contrato único entre frontend y backend. Los tipos TypeScript del frontend
    se generan a partir de este archivo. Documentación y decisiones en
    packages/contracts/README.md.


    Convenciones:

    - El dinero y las tasas viajan como string decimal ("1200.00", "0.15"), nunca
      como número JSON, para que ningún extremo los lea como punto flotante.

    - El cliente nunca envía precios: el backend los toma de su catálogo.

    - Los errores siguen Problem Details (RFC 9457) con un `code` de negocio estable.
servers:
  - url: http://localhost:8080/api/v1

tags:
  - name: Catálogo
    description: Productos disponibles para la compra (HU1)
  - name: Checkout
    description: Cálculo del desglose de descuentos y confirmación de la orden (HU2, HU3, HU4)
  - name: Operación
    description: Estado del servicio para monitoreo

paths:
  /health:
    servers:
      - url: http://localhost:8080
        description: Fuera de /api/v1, para monitoreo
    get:
      tags: [Operación]
      operationId: getHealth
      summary: Estado del servicio
      description: >
        `UP` si el servicio y su base están operativos. No incluye detalles internos
        (rutas, versiones ni componentes).
      responses:
        '200':
          description: Servicio operativo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: UP
            # Tipo por defecto de Actuator si el cliente no pide application/json
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: El servicio o una de sus dependencias, como la base, no está disponible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: DOWN
            # Tipo por defecto de Actuator si el cliente no pide application/json
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                $ref: '#/components/schemas/Health'

  /products:
    get:
      tags: [Catálogo]
      operationId: listProducts
      summary: Lista los productos en stock
      description: >
        Devuelve los productos activos con stock disponible mayor que cero, ordenados
        por `id`. El stock es el vivo en memoria, que ya descuenta las ventas, no el
        stock inicial del catálogo.
      responses:
        '200':
          description: Productos en stock. Lista vacía si no hay ninguno.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
              example:
                - id: 1
                  name: Laptop 14"
                  unitPrice: '1200.00'
                  category: Tecnología
                  availableStock: 10
                - id: 4
                  name: Lámpara de escritorio
                  unitPrice: '40.00'
                  category: Hogar
                  availableStock: 15
        '500':
          $ref: '#/components/responses/PersistenceError'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'

  /checkouts/preview:
    post:
      tags: [Checkout]
      operationId: previewCheckout
      summary: Calcula el desglose sin confirmar la compra
      description: >
        Aplica las mismas validaciones y la misma cascada de descuentos que
        `POST /checkouts`, pero no guarda la orden ni descuenta stock. Sirve para
        mostrar el desglose y la alerta del tope antes de confirmar. Que la
        previsualización tenga éxito no reserva unidades: el checkout puede fallar
        después con `INSUFFICIENT_STOCK`.
      requestBody:
        $ref: '#/components/requestBodies/CheckoutRequest'
      responses:
        '200':
          description: Desglose calculado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutBreakdown'
              examples:
                conCupon:
                  $ref: '#/components/examples/BreakdownWithCoupon'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/InsufficientStock'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/BusinessRuleViolation'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/PersistenceError'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'

  /checkouts:
    post:
      tags: [Checkout]
      operationId: createCheckout
      summary: Confirma la compra y guarda el checkout
      description: >
        Valida el carrito contra el catálogo, reserva el stock de forma atómica,
        aplica la cascada de descuentos (categoría → volumen → cupón → tope) y
        guarda la orden con su desglose en una sola transacción. Si algo falla,
        no se guarda nada y el stock no cambia.


        Con `Idempotency-Key`, un reintento con la misma clave y el mismo cuerpo
        devuelve la orden ya creada (201, mismo `id`) sin reservar stock otra vez.
        La misma clave con otro cuerpo responde 409 `IDEMPOTENCY_KEY_REUSED`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/CheckoutRequest'
      responses:
        '201':
          description: >
            Checkout guardado. Si la clave de idempotencia ya se usó con el mismo
            cuerpo, es la orden guardada en el primer intento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checkout'
              example:
                id: 1
                createdAt: '2026-10-15T19:30:00.000Z'
                couponCode: WELCOME2026
                lines:
                  - productId: 1
                    name: Laptop 14"
                    category: Tecnología
                    quantity: 2
                    unitPrice: '1200.00'
                    lineSubtotal: '2400.00'
                  - productId: 4
                    name: Lámpara de escritorio
                    category: Hogar
                    quantity: 1
                    unitPrice: '40.00'
                    lineSubtotal: '40.00'
                discounts:
                  - step: 1
                    rule: CATEGORY
                    rate: '0.10'
                    reference: Tecnología
                    baseAmount: '2400.00'
                    amount: '240.00'
                  - step: 2
                    rule: VOLUME
                    rate: '0.05'
                    reference: '100.00'
                    baseAmount: '2200.00'
                    amount: '110.00'
                  - step: 3
                    rule: COUPON
                    rate: '0.15'
                    reference: WELCOME2026
                    baseAmount: '2090.00'
                    amount: '313.50'
                subtotal: '2440.00'
                discountTotal: '663.50'
                total: '1776.50'
                maxDiscountRate: '0.35'
                capApplied: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/CheckoutConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/BusinessRuleViolation'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/PersistenceError'
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'

components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >
        UUID que identifica un intento de pago. El cliente lo genera una vez por
        intento y lo reenvía en cada reintento de ese intento. Se compara sin
        distinguir mayúsculas. Sin clave, cada petición crea una orden nueva.
      schema:
        type: string
        format: uuid
      example: 3f0c9d2e-7b1a-4c5e-9f8d-2a6b4e1c0d7f

  schemas:
    Money:
      description: >
        Monto en USD con exactamente 2 decimales. Es un total final, redondeado HALF_EVEN;
        si se aplicó el tope, `discountTotal` se redondea hacia abajo para no superarlo.
      type: string
      pattern: '^\d+\.\d{2}$'
      example: '1200.00'

    Decimal:
      description: >
        Monto en USD sin redondear (montos intermedios de la cascada). El frontend
        lo redondea solo para mostrarlo.
      type: string
      pattern: '^\d+(\.\d+)?$'
      example: '8.550'

    Rate:
      description: Tasa entre 0 y 1 como string decimal ("0.15" = 15%).
      type: string
      pattern: '^(0(\.\d+)?|1(\.0+)?)$'
      example: '0.15'

    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [UP, DOWN, OUT_OF_SERVICE, UNKNOWN]

    Product:
      type: object
      required: [id, name, unitPrice, category, availableStock]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          description: Identificador que el cliente envía como `productId` en el checkout.
        name:
          type: string
          minLength: 1
        unitPrice:
          $ref: '#/components/schemas/Money'
        category:
          type: string
          minLength: 1
          description: Categoría del catálogo. Se compara con `discounts.category.name` para el descuento de categoría.
        availableStock:
          type: integer
          format: int32
          minimum: 1
          description: Unidades disponibles ahora mismo. Sirve para limitar la cantidad en el carrito.

    CheckoutItemRequest:
      type: object
      additionalProperties: false
      required: [productId, quantity]
      properties:
        productId:
          type: integer
          format: int64
          minimum: 1
        quantity:
          type: integer
          format: int32
          minimum: 1

    CheckoutRequest:
      description: >
        Lo único que envía el cliente: productos, cantidades y cupón. No admite
        propiedades adicionales, así que un precio enviado por el cliente se rechaza
        con `VALIDATION_ERROR`. Si un `productId` se repite, las cantidades se suman.
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          description: >
            Como máximo 100 líneas: el backend busca cada una en el catálogo. Las
            unidades van en `quantity`, así que un carrito real usa pocas líneas.
            Con más de 100 responde `VALIDATION_ERROR` en el campo `items`.
          items:
            $ref: '#/components/schemas/CheckoutItemRequest'
        couponCode:
          type: string
          nullable: true
          minLength: 1
          maxLength: 50
          description: >
            Código del cupón, opcional. Se comparan ignorando mayúsculas y espacios
            al inicio y al final. Uno que no está registrado responde `INVALID_COUPON`.
          example: WELCOME2026

    CheckoutLine:
      type: object
      required: [productId, name, category, quantity, unitPrice, lineSubtotal]
      properties:
        productId:
          type: integer
          format: int64
        name:
          type: string
        category:
          type: string
        quantity:
          type: integer
          format: int32
          minimum: 1
        unitPrice:
          $ref: '#/components/schemas/Money'
        lineSubtotal:
          $ref: '#/components/schemas/Money'

    AppliedDiscount:
      description: >
        Un paso de la cascada que tuvo efecto. Los pasos sin efecto (p. ej. volumen
        sin superar el umbral) no aparecen. En `CAP`, `baseAmount` es el descuento
        acumulado antes del tope y `amount` es el exceso recortado.
      type: object
      required: [step, rule, rate, reference, baseAmount, amount]
      properties:
        step:
          type: integer
          minimum: 1
          maximum: 4
          description: Posición en la cascada (1 CATEGORY, 2 VOLUME, 3 COUPON, 4 CAP).
        rule:
          type: string
          enum: [CATEGORY, VOLUME, COUPON, CAP]
        rate:
          $ref: '#/components/schemas/Rate'
        reference:
          type: string
          nullable: true
          description: Categoría, umbral de volumen o código del cupón según la regla; `null` en `CAP`.
        baseAmount:
          $ref: '#/components/schemas/Decimal'
        amount:
          $ref: '#/components/schemas/Decimal'

    CheckoutBreakdown:
      description: >
        Desglose del carrito. Se cumple que `total = subtotal - discountTotal` y que
        `discountTotal <= subtotal × maxDiscountRate`. Para garantizarlo, cuando se aplica
        el tope `discountTotal` se redondea hacia abajo (subtotal 100.10, tope 0.35 →
        35.03, no 35.04); en los demás casos se redondea HALF_EVEN.
      type: object
      required: [couponCode, lines, discounts, subtotal, discountTotal, total, maxDiscountRate, capApplied]
      properties:
        couponCode:
          type: string
          nullable: true
          description: Cupón aplicado tal como está configurado, o `null` si no se envió.
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CheckoutLine'
        discounts:
          type: array
          description: Pasos aplicados, ordenados por `step`.
          items:
            $ref: '#/components/schemas/AppliedDiscount'
        subtotal:
          $ref: '#/components/schemas/Money'
        discountTotal:
          $ref: '#/components/schemas/Money'
        total:
          $ref: '#/components/schemas/Money'
        maxDiscountRate:
          $ref: '#/components/schemas/Rate'
        capApplied:
          type: boolean
          description: Si es `true`, el descuento se truncó en el tope y el frontend muestra la alerta de HU4.

    Checkout:
      description: Checkout confirmado y guardado.
      allOf:
        - $ref: '#/components/schemas/CheckoutBreakdown'
        - type: object
          required: [id, createdAt]
          properties:
            id:
              type: integer
              format: int64
            createdAt:
              type: string
              format: date-time

    ProblemCode:
      description: Código de negocio estable. El frontend elige el mensaje según este valor, no según `detail`.
      type: string
      enum:
        - VALIDATION_ERROR
        - EMPTY_CART
        - PRODUCT_NOT_FOUND
        - INVALID_COUPON
        - COUPON_EXPIRED
        - INSUFFICIENT_STOCK
        - IDEMPOTENCY_KEY_REUSED
        - DATA_INTEGRITY_VIOLATION
        - DATABASE_UNAVAILABLE
        - PERSISTENCE_ERROR
        - PAYLOAD_TOO_LARGE
        - TOO_MANY_REQUESTS

    Problem:
      description: >
        Error en formato Problem Details (RFC 9457). Nunca incluye el mensaje de la
        base, el SQL ni la traza.
      type: object
      required: [title, status, code]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          $ref: '#/components/schemas/ProblemCode'

    ValidationProblem:
      description: '`VALIDATION_ERROR`: el cuerpo no cumple el contrato.'
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            errors:
              type: array
              items:
                type: object
                required: [field, message]
                properties:
                  field:
                    type: string
                    example: items[0].quantity
                  message:
                    type: string

    ProductNotFoundProblem:
      description: '`PRODUCT_NOT_FOUND`: el producto no existe o está inactivo.'
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [productId]
          properties:
            productId:
              type: integer
              format: int64

    InsufficientStockProblem:
      description: '`INSUFFICIENT_STOCK`: no alcanzan las unidades de un producto.'
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [productId, requested, available]
          properties:
            productId:
              type: integer
              format: int64
            requested:
              type: integer
              format: int32
            available:
              type: integer
              format: int32

  requestBodies:
    CheckoutRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CheckoutRequest'
          examples:
            conCupon:
              summary: Dos laptops y una lámpara con cupón
              value:
                items:
                  - productId: 1
                    quantity: 2
                  - productId: 4
                    quantity: 1
                couponCode: WELCOME2026
            sinCupon:
              summary: Un solo producto, sin cupón
              value:
                items:
                  - productId: 5
                    quantity: 3

  responses:
    BadRequest:
      description: >
        `VALIDATION_ERROR` si el cuerpo no cumple el contrato (JSON corrupto, tipos
        incorrectos, cantidad menor que 1, propiedades no permitidas como un precio)
        o si `Idempotency-Key` no es un UUID. `EMPTY_CART` si `items` está vacío.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
          example:
            type: about:blank
            title: Solicitud inválida
            status: 400
            detail: El cuerpo de la solicitud no es válido.
            code: VALIDATION_ERROR
            errors:
              - field: items[0].quantity
                message: debe ser mayor o igual que 1

    InsufficientStock:
      description: '`INSUFFICIENT_STOCK`: no hay unidades suficientes; no se reservó nada.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/InsufficientStockProblem'
          example:
            type: about:blank
            title: Stock insuficiente
            status: 409
            detail: No hay unidades suficientes del producto 6.
            code: INSUFFICIENT_STOCK
            productId: 6
            requested: 1
            available: 0

    CheckoutConflict:
      description: >
        `INSUFFICIENT_STOCK` si no hay unidades suficientes (no se reservó nada).
        `IDEMPOTENCY_KEY_REUSED` si la `Idempotency-Key` ya se usó con otro cuerpo
        (no se creó otra orden ni se reservó stock).
      content:
        application/problem+json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/InsufficientStockProblem'
              - $ref: '#/components/schemas/Problem'
          examples:
            stockInsuficiente:
              value:
                type: about:blank
                title: Stock insuficiente
                status: 409
                detail: No hay unidades suficientes del producto 6.
                code: INSUFFICIENT_STOCK
                productId: 6
                requested: 1
                available: 0
            claveReutilizada:
              value:
                type: about:blank
                title: Clave de idempotencia reutilizada
                status: 409
                detail: La clave de idempotencia ya se usó con otra solicitud.
                code: IDEMPOTENCY_KEY_REUSED

    BusinessRuleViolation:
      description: >
        La solicitud es válida pero viola una regla de negocio:
        `PRODUCT_NOT_FOUND` (incluye `productId`), `INVALID_COUPON` (cupón no
        registrado), `COUPON_EXPIRED` (cupón vencido) o `DATA_INTEGRITY_VIOLATION`
        (la base rechazó la orden por inconsistente; no se guardó).
      content:
        application/problem+json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ProductNotFoundProblem'
              - $ref: '#/components/schemas/Problem'
          examples:
            cuponInvalido:
              value:
                type: about:blank
                title: Cupón inválido
                status: 422
                detail: El cupón no está registrado.
                code: INVALID_COUPON
            productoInexistente:
              value:
                type: about:blank
                title: Producto no encontrado
                status: 422
                detail: El producto 999 no existe.
                code: PRODUCT_NOT_FOUND
                productId: 999

    PayloadTooLarge:
      description: >
        `PAYLOAD_TOO_LARGE`: el cuerpo supera 16 KB. Se rechaza antes de leer el
        JSON; un pedido de 100 líneas ocupa unos 4 KB.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Solicitud demasiado grande
            status: 413
            detail: El cuerpo de la solicitud supera el tamaño máximo permitido.
            code: PAYLOAD_TOO_LARGE

    TooManyRequests:
      description: >
        `TOO_MANY_REQUESTS`: la IP superó el límite de peticiones (60 por minuto entre
        `POST /checkouts` y `/checkouts/preview`) o acumuló demasiados cupones
        rechazados (10 cada 15 minutos). En el segundo caso se bloquea también con un
        cupón válido, para no confirmar qué códigos existen. No se procesó la petición.
      headers:
        Retry-After:
          description: Segundos que hay que esperar antes de reintentar.
          schema:
            type: integer
            minimum: 1
          example: 12
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Demasiadas solicitudes
            status: 429
            detail: Se superó el límite de solicitudes. Intenta de nuevo más tarde.
            code: TOO_MANY_REQUESTS

    PersistenceError:
      description: '`PERSISTENCE_ERROR`: error interno al procesar los datos.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Error interno
            status: 500
            detail: Ocurrió un error al procesar los datos.
            code: PERSISTENCE_ERROR

    DatabaseUnavailable:
      description: '`DATABASE_UNAVAILABLE`: la base no está disponible por ahora; el cliente puede reintentar.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Servicio no disponible
            status: 503
            detail: No fue posible acceder a los datos. Intenta de nuevo en unos segundos.
            code: DATABASE_UNAVAILABLE

  examples:
    BreakdownWithCoupon:
      summary: Desglose de dos laptops y una lámpara con cupón
      value:
        couponCode: WELCOME2026
        lines:
          - productId: 1
            name: Laptop 14"
            category: Tecnología
            quantity: 2
            unitPrice: '1200.00'
            lineSubtotal: '2400.00'
          - productId: 4
            name: Lámpara de escritorio
            category: Hogar
            quantity: 1
            unitPrice: '40.00'
            lineSubtotal: '40.00'
        discounts:
          - step: 1
            rule: CATEGORY
            rate: '0.10'
            reference: Tecnología
            baseAmount: '2400.00'
            amount: '240.00'
          - step: 2
            rule: VOLUME
            rate: '0.05'
            reference: '100.00'
            baseAmount: '2200.00'
            amount: '110.00'
          - step: 3
            rule: COUPON
            rate: '0.15'
            reference: WELCOME2026
            baseAmount: '2090.00'
            amount: '313.50'
        subtotal: '2440.00'
        discountTotal: '663.50'
        total: '1776.50'
        maxDiscountRate: '0.35'
        capApplied: false
